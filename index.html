<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reason Rush</title>
<link rel="stylesheet" href="css/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/reasons.js"></script>
<script src="js/avatars.js"></script>
<script src="js/rail.js"></script>
<script src="js/net.js"></script>
</head>
<body>
<div class="wrap">

  <!-- ============ join ============ -->
  <section id="s-join" class="narrow-inner">
    <div class="center" style="margin:8px 0 18px">
      <div class="rail hero" id="rail-hero"></div>
      <h1 class="logo">Reason Rush</h1>
      <p class="sub" id="t-tag" style="margin-bottom:0">Geometry reasons · Grade 8</p>
    </div>
    <div class="card">
      <label class="fld" id="l-name">Your name</label>
      <input type="text" id="i-name" maxlength="18" autocomplete="off" autocapitalize="words">
      <label class="fld" id="l-code">Class code</label>
      <input type="text" id="i-code" maxlength="10" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <label class="fld" id="l-lang">Language</label>
      <div class="row">
        <button class="btn ghost grow" id="b-en">English</button>
        <button class="btn ghost grow" id="b-af">Afrikaans</button>
      </div>
      <label class="fld" id="l-av">Pick your character</label>
      <div class="avrow">
        <span class="avpre" id="av-pre">🔵</span>
        <button class="btn ghost grow" id="b-shuffle">🎲 Surprise me</button>
      </div>
      <div class="avgrid" id="av-grid"></div>
      <p id="p-err" class="sub hide" style="color:var(--bad);margin:12px 0 0;font-weight:700"></p>
      <div style="margin-top:16px"><button class="btn wide" id="b-join">Play!</button></div>
    </div>
  </section>

  <!-- ============ lobby ============ -->
  <section id="s-lobby" class="hide narrow-inner">
    <div class="card center">
      <div class="bigav" id="lb-av">🔵</div>
      <h1 id="t-hi">You're in!</h1>
      <p class="sub" id="t-wait">Wait for your teacher to start.</p>
      <div class="chips" style="justify-content:center"><span class="chip" id="c-me"></span></div>
    </div>
  </section>

  <!-- ============ question ============ -->
  <section id="s-q" class="hide">
    <div class="row between" style="margin-bottom:8px">
      <strong id="t-qn"></strong>
      <span class="timer" id="t-clock">20</span>
    </div>
    <!-- the letter rail IS the progress bar: tiles drain as time runs out -->
    <div class="rail" id="rail-q" style="margin-bottom:12px"></div>
    <!-- side by side on anything wide, stacked on a portrait tablet -->
    <div class="split even">
      <div class="figbox" id="q-fig"></div>
      <div>
        <p class="prompt" id="q-prompt">For why?</p>
        <div class="opts" id="q-opts"></div>
        <p class="sub center hide" id="t-locked" style="margin-top:14px;font-weight:700"></p>
      </div>
    </div>
  </section>

  <!-- ============ reveal ============ -->
  <section id="s-reveal" class="hide narrow-inner">
    <div class="verdict" id="v-card">
      <div class="vav" id="v-av"></div>
      <div class="mark" id="v-mark">✓</div>
      <div class="pts" id="v-pts"></div>
      <div class="note" id="v-note"></div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="rail" id="rail-r" style="margin-bottom:14px"></div>
      <p class="sub center" style="margin:0 0 10px" id="t-answer-lbl">The answer</p>
      <p class="center" style="margin:0 0 14px"><span class="reason" id="r-text"></span></p>
      <p class="center sub hide" id="r-why" style="font-weight:600"></p>
      <div class="figbox" id="r-fig"></div>
    </div>
  </section>

  <!-- ============ podium ============ -->
  <section id="s-podium" class="hide narrow-inner">
    <div class="card center">
      <h1 class="logo" id="t-final">Final scores</h1>
      <div class="podium" id="pod"></div>
      <p class="sub" id="t-you"></p>
    </div>
  </section>

</div>

<script>
/* ---------------------------------------------------------------
   Player screen. Receives ready-made SVG from the host, so the answer
   key never travels to a learner's laptop.
   --------------------------------------------------------------- */
const $ = id => document.getElementById(id);
const SECTIONS = ['s-join', 's-lobby', 's-q', 's-reveal', 's-podium'];
const show = id => SECTIONS.forEach(s => $(s).classList.toggle('hide', s !== id));

const T = {
  tag:    { en: 'Geometry reasons · Grade 8', af: 'Meetkunde-redes · Graad 8' },
  name:   { en: 'Your name', af: 'Jou naam' },
  code:   { en: 'Class code', af: 'Klaskode' },
  lang:   { en: 'Language', af: 'Taal' },
  join:   { en: 'Play!', af: 'Speel!' },
  avLabel:{ en: 'Pick your character', af: 'Kies jou karakter' },
  shuffle:{ en: '🎲 Surprise me', af: '🎲 Verras my' },
  hi:     { en: "You're in!", af: 'Jy is in!' },
  wait:   { en: 'Wait for your teacher to start.', af: 'Wag vir jou juffrou om te begin.' },
  noName: { en: 'Type your name first.', af: 'Tik eers jou naam.' },
  badCode:{ en: 'That class code is not right.', af: 'Daardie klaskode is verkeerd.' },
  locked: { en: 'Locked in — waiting for the others…', af: 'Ingesluit — wag vir die ander…' },
  tooLate:{ en: 'Time was up.', af: 'Die tyd was om.' },
  answer: { en: 'The answer', af: 'Die antwoord' },
  qn:     { en: n => 'Question ' + n.a + ' of ' + n.b, af: n => 'Vraag ' + n.a + ' van ' + n.b },
  final:  { en: 'Final scores', af: 'Finale punte' },
  youAre: { en: p => 'You finished ' + ordinal(p.place, 'en') + ' with ' + p.score + ' points.',
            af: p => 'Jy het ' + ordinal(p.place, 'af') + ' geëindig met ' + p.score + ' punte.' },
  linesWrong: { en: 'The reason was right — the parallel lines were not.',
                af: 'Die rede was reg — die ewewydige lyne nie.' },
  soFar:  { en: n => n + ' points so far', af: n => n + ' punte altesaam' },
  gone:   { en: 'Game over. Thanks for playing!', af: 'Speletjie klaar. Dankie vir die speel!' },
  offline:{ en: 'Reconnecting…', af: 'Herkoppel tans…' }
};
const tr = (k, arg) => { const v = T[k][me.lang] || T[k].en; return typeof v === 'function' ? v(arg) : v; };

const me = {
  pid: playerId(),
  name: store.get('rr-name') || '',
  lang: store.get('rr-lang') || 'en',
  joined: false,
  answered: {},          // "n:part" -> choice id
  shownAt: 0,
  hostSince: 0,          // birth time of the host we're latched to — older tabs are ignored
  screen: ''             // phase:n:part of what's on screen, so heartbeats don't rebuild it
};
let net = null, tick = null, lastState = null, backTrapped = false;

/* Kids WILL press back and refresh (Megan, 2026-08-13). Back: keep a state on
   the history stack and push it right back on popstate, so the button does
   nothing. Refresh: rr-joined in storage lets the page rejoin silently with
   the same pid, so the score survives. */
function trapBack() {
  if (backTrapped) return;
  backTrapped = true;
  try { history.pushState({ rr: 1 }, ''); } catch (e) {}
  addEventListener('popstate', () => { try { history.pushState({ rr: 1 }, ''); } catch (e) {} });
}

/* The channel is writable by anyone with the page source, so host-supplied
   markup gets one hard check before innerHTML: our own diagrams contain none
   of these patterns, and anything that does is dropped whole. */
function cleanSvg(s) {
  if (typeof s !== 'string' || s.length > 300000) return '';
  if (/<script|<foreignobject|<iframe|<embed|<object|<image|javascript:|\son\w+\s*=|xlink:href/i.test(s)) return '';
  return s;
}

/* ---------- join ---------- */
function paintJoinLang() {
  $('b-en').className = 'btn grow' + (me.lang === 'en' ? '' : ' ghost');
  $('b-af').className = 'btn grow' + (me.lang === 'af' ? '' : ' ghost');
  $('t-tag').textContent = tr('tag');
  $('l-name').textContent = tr('name');
  $('l-code').textContent = tr('code');
  $('l-lang').textContent = tr('lang');
  $('l-av').textContent = tr('avLabel');
  $('b-shuffle').textContent = tr('shuffle');
  $('b-join').textContent = tr('join');
  /* avatar names double as tooltips, in the picked language */
  [...$('av-grid').children].forEach((b, i) => { b.title = AVATARS[i].label[me.lang] || AVATARS[i].label.en; });
}

/* ---------- avatar picker ---------- */
me.avatar = avValid(store.get('rr-avatar') || avRandom());

function paintAvatar() {
  $('av-pre').textContent = avEmoji(me.avatar);
  [...$('av-grid').children].forEach((b, i) => b.classList.toggle('sel', AVATARS[i].id === me.avatar));
  const sel = $('av-grid').querySelector('.sel');
  if (sel) sel.scrollIntoView({ block: 'nearest' });
}
AVATARS.forEach(a => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'av'; b.textContent = a.emoji;
  b.onclick = () => { me.avatar = a.id; paintAvatar(); };
  $('av-grid').appendChild(b);
});
$('b-shuffle').onclick = () => {
  let next = me.avatar;
  while (next === me.avatar) next = avRandom();
  me.avatar = next; paintAvatar();
};
$('b-en').onclick = () => { me.lang = 'en'; paintJoinLang(); };
$('b-af').onclick = () => { me.lang = 'af'; paintJoinLang(); };
$('i-name').value = me.name;

function err(msg) {
  const p = $('p-err');
  if (!msg) { p.classList.add('hide'); return; }
  p.textContent = msg; p.classList.remove('hide');
}

$('b-join').onclick = () => {
  const name = $('i-name').value.trim().replace(/\s+/g, ' ');
  const code = $('i-code').value.trim().toUpperCase();
  if (!name) return err(tr('noName'));
  if (code !== CONFIG.CLASS_CODE) return err(tr('badCode'));
  err('');
  me.pid = playerId();          // fresh id if the last game was ended and wiped
  me.name = name; me.joined = true;
  store.set('rr-name', name);
  store.set('rr-lang', me.lang);
  store.set('rr-avatar', me.avatar);
  store.set('rr-joined', '1');
  $('c-me').textContent = name;
  $('lb-av').textContent = avEmoji(me.avatar);
  $('t-hi').textContent = tr('hi');
  $('t-wait').textContent = tr('wait');
  show('s-lobby');
  trapBack();
  connect();
  /* if we were already connected (auto-rejoin, then the form re-submitted with
     a new name or avatar), the SUBSCRIBED hello has long passed — announce the
     fresh details now. Harmless duplicate on a brand-new connection. */
  sayHello();
};
$('i-code').addEventListener('keydown', e => { if (e.key === 'Enter') $('b-join').click(); });
$('i-name').addEventListener('keydown', e => { if (e.key === 'Enter') $('i-code').focus(); });

/* ---------- connection ---------- */
function connect() {
  if (net) return;
  net = makeNet(onEvent, status => {
    if (status === 'SUBSCRIBED') sayHello();
  });
}
function sayHello() {
  net.send('join', { pid: me.pid, name: me.name, lang: me.lang, avatar: me.avatar });
}

function onEvent(event, p) {
  if (event === 'state') {
    /* the newest host tab wins; anything from an out-ranked host is noise */
    const s = p.since || 0;
    if (s < me.hostSince) return;
    me.hostSince = s;
    render(p);
  }
  else if (event === 'ping') sayHello();   // host asking everyone to check in
}

/* ---------- render ---------- */
function render(st) {
  lastState = st;
  /* every state carries the host's player list — if we're not on it, our join
     got lost somewhere, so introduce ourselves again. Heartbeats arrive every
     2.5s, so this self-heals joins, reconnects and host restarts alike. */
  if (me.joined && st.pids && st.pids.indexOf(me.pid) < 0) sayHello();
  /* same screen as before → don't rebuild it (a heartbeat mid-tap would yank
     the buttons out from under a finger and reset the speed-points clock);
     just pull the countdown back in line with the host */
  const key = st.phase + ':' + (st.n || 0) + ':' + (st.part || 0);
  if (key === me.screen) {
    if ((st.phase === 'q' || st.phase === 'q2') && st.msLeft !== undefined)
      startClock(st.msLeft, st.seconds * 1000);
    return;
  }
  me.screen = key;
  if (st.phase === 'lobby') { show('s-lobby'); stopClock(); return; }
  if (st.phase === 'q' || st.phase === 'q2') return renderQ(st);
  if (st.phase === 'reveal') return renderReveal(st);
  if (st.phase === 'podium') return renderPodium(st);
  if (st.phase === 'ended') {
    /* a full reset, not just a screen change: drop the channel and forget who
       this was, so nobody is silently sitting in the NEXT game's lobby without
       having typed their name (Megan's rule — a new round means logging in
       again) */
    stopClock();
    store.del('rr-pid');
    store.del('rr-name');
    store.del('rr-joined');
    store.del('rr-avatar');
    if (net) { net.leave(); net = null; }
    me.joined = false; me.answered = {}; me.name = ''; me.screen = '';
    me.avatar = avRandom();
    paintAvatar();
    $('i-name').value = '';
    $('i-code').value = '';
    $('t-tag').textContent = tr('gone');
    show('s-join');
  }
}

function renderQ(st) {
  stopClock();
  const key = st.n + ':' + st.part;
  railMount($('rail-q'));
  railReset($('rail-q'));
  $('t-qn').textContent = tr('qn', { a: st.n, b: st.total });
  $('q-fig').innerHTML = cleanSvg(st.svg);
  $('q-opts').innerHTML = '';
  $('t-locked').classList.add('hide');

  let prompt, opts, cls;
  if (st.part === 2) {
    prompt = UI.whichPar[me.lang] || UI.whichPar.en;
    opts = st.options.map(o => ({ id: o, text: o }));
    cls = 'opts one';
  } else if (st.kind === 'yesno') {
    prompt = UI.isExt[me.lang] || UI.isExt.en;
    opts = ['yes', 'no'].map(id => ({ id, text: YESNO[id][me.lang] || YESNO[id].en, yesno: true }));
    cls = 'opts big';
  } else {
    prompt = UI.forWhy[me.lang] || UI.forWhy.en;
    opts = OPTION_ORDER.map(id => ({ id, text: optionText(id, me.lang) }));
    cls = 'opts';
  }
  $('q-prompt').textContent = prompt;
  $('q-prompt').className = 'prompt' + (st.part === 2 || st.kind === 'yesno' ? ' small' : '');
  $('q-opts').className = cls;

  const done = !!me.answered[key];
  opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt' + (o.yesno ? ' yesno' : '') + (me.answered[key] === o.id ? ' picked' : '');
    b.textContent = o.text;
    b.disabled = done;
    b.onclick = () => pick(st, o.id);
    $('q-opts').appendChild(b);
  });
  if (done) lock();

  me.shownAt = Date.now();
  /* count down the time the HOST says is left, not a fresh full round — a
     tablet that drops off and rejoins mid-question must not get its own
     private extra seconds */
  startClock(st.msLeft === undefined ? st.seconds * 1000 : st.msLeft, st.seconds * 1000);
  show('s-q');
}

function pick(st, id) {
  const key = st.n + ':' + st.part;
  if (me.answered[key]) return;
  me.answered[key] = id;
  net.send('answer', {
    pid: me.pid, n: st.n, part: st.part, choice: id,
    ms: Date.now() - me.shownAt
  });
  const opts = [...$('q-opts').children];
  opts.forEach(b => { b.disabled = true; });
  const idx = st.part === 2 ? st.options.indexOf(id)
            : st.kind === 'yesno' ? ['yes', 'no'].indexOf(id)
            : OPTION_ORDER.indexOf(id);
  if (opts[idx]) opts[idx].classList.add('picked');
  lock();
}

function lock() {
  $('t-locked').textContent = tr('locked');
  $('t-locked').classList.remove('hide');
}

function renderReveal(st) {
  stopClock();
  railMount($('rail-r'));
  railGlow($('rail-r'), st.letter || 'Δ');
  const v = (st.verdicts || {})[me.pid];
  const ok = v && v.ok;
  $('v-card').className = 'verdict ' + (ok ? 'ok' : 'no');
  $('v-av').textContent = avEmoji(me.avatar);
  $('v-mark').textContent = ok ? '✓' : '✗';
  $('v-pts').textContent = v && v.pts ? '+' + v.pts : (v ? '0' : tr('tooLate'));
  let note = '';
  if (!v) note = tr('tooLate');
  else if (v.trap) note = trapWhy(v.trap, me.lang);
  else if (v.ok && v.linesOk === false) note = tr('linesWrong');
  else note = tr('soFar', v.total);
  $('v-note').textContent = note;

  $('t-answer-lbl').textContent = tr('answer');
  $('r-text').textContent = st.reveal[me.lang] || st.reveal.en;
  const why = st.why ? (st.why[me.lang] || st.why.en) : '';
  $('r-why').textContent = why;
  $('r-why').classList.toggle('hide', !why);
  $('r-fig').innerHTML = cleanSvg(st.svgR);
  show('s-reveal');
}

function renderPodium(st) {
  stopClock();
  $('t-final').textContent = tr('final');
  $('pod').innerHTML = '';
  const order = [1, 0, 2];   // 2nd, 1st, 3rd — so first place stands in the middle
  order.forEach(i => {
    const p = st.top3[i];
    if (!p) return;
    const d = document.createElement('div');
    d.className = 'pod p' + (i + 1);
    d.innerHTML = '<div class="pav-big"></div><div class="name"></div><div class="block">' + (i + 1) +
                  '</div><div class="score">' + p.score + '</div>';
    d.querySelector('.pav-big').textContent = avEmoji(p.avatar);
    d.querySelector('.name').textContent = p.name;
    $('pod').appendChild(d);
  });
  const mine = (st.places || {})[me.pid];
  $('t-you').textContent = mine ? tr('youAre', mine) : '';
  show('s-podium');
}

/* ---------- clock ---------- */
function startClock(msLeft, totalMs) {
  const end = Date.now() + msLeft;
  const paint = () => {
    const left = Math.max(0, end - Date.now());
    const s = Math.ceil(left / 1000);
    $('t-clock').textContent = s;
    $('t-clock').className = 'timer' + (s <= 5 ? ' low' : '');
    railDrain($('rail-q'), 1 - left / totalMs);
    if (left <= 0) stopClock();
  };
  paint();
  tick = setInterval(paint, 200);
}
function stopClock() { if (tick) { clearInterval(tick); tick = null; } }

paintJoinLang();
paintAvatar();
railMount($('rail-hero'), { stagger: true });

/* refresh mid-game? rejoin silently with the same pid — the score lives on
   the host keyed by pid, so nothing is lost. The next heartbeat (≤2.5s away)
   puts the right screen back. */
if (me.name && store.get('rr-joined') === '1') {
  me.joined = true;
  store.set('rr-avatar', me.avatar);   // keep the same face across re-hellos
  $('c-me').textContent = me.name;
  $('lb-av').textContent = avEmoji(me.avatar);
  $('t-hi').textContent = tr('hi');
  $('t-wait').textContent = tr('wait');
  show('s-lobby');
  trapBack();
  connect();
} else {
  show('s-join');
}
</script>
</body>
</html>
