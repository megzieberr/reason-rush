<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reason Rush — teacher</title>
<link rel="stylesheet" href="css/app.css">
<style>
  /* the projector-screen language pill (learners pick their own at join) */
  #langpill { position: fixed; top: 10px; right: 12px; z-index: 60; display: flex; gap: 6px; }
  #langpill button { font: 600 13px Fredoka, sans-serif; padding: 6px 12px; border-radius: 999px;
    border: 2px solid var(--edge); background: #fff; color: var(--ink); cursor: pointer; }
  #langpill button.on { background: var(--teal); border-color: var(--teal); color: #fff; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/avatars.js"></script>
<script src="js/rail.js"></script>
<script src="js/geom.js"></script>
<script src="js/diagrams.js"></script>
<script src="js/reasons.js"></script>
<script src="js/questions.js"></script>
<script src="js/net.js"></script>
</head>
<body>
<div id="langpill">
  <button id="lang-en" type="button">EN</button>
  <button id="lang-af" type="button">AF</button>
</div>
<div class="wrap">

  <!-- ============ lobby ============ -->
  <section id="s-lobby">
    <div class="center" style="margin:6px 0 18px">
      <div class="rail hero" id="rail-hero"></div>
      <h1 class="logo">Reason Rush</h1>
    </div>
    <div class="split">
      <div class="card center">
        <p class="sub" style="margin:0" id="t-code-lbl">Class code</p>
        <p class="code" id="h-code">MATH</p>
        <p class="sub" id="h-url" style="word-break:break-all"></p>
        <button class="btn wide" id="b-start" disabled>Start — 0 players</button>
        <p class="sub" style="margin:12px 0 0;font-size:13px" id="t-nosave">
          Nothing is saved. Names and scores live only in this tab until you end the game.
        </p>
      </div>
      <div class="card">
        <h2 id="h-count">Nobody has joined yet</h2>
        <div class="pwall" id="h-roster"></div>
      </div>
    </div>
  </section>

  <!-- ============ question ============ -->
  <section id="s-q" class="hide">
    <div class="row between" style="margin-bottom:8px">
      <strong id="h-qn"></strong>
      <span id="h-tally" class="chip"></span>
      <span class="timer" id="h-clock">20</span>
    </div>
    <div class="rail" id="rail-q" style="margin-bottom:12px"></div>
    <div class="split">
      <div>
        <div class="figbox" id="h-fig"></div>
        <p class="prompt" id="h-prompt">For why?</p>
      </div>
      <div class="card">
        <h2 id="h-opts-title">On their screens</h2>
        <div id="h-opts" class="chips"></div>
        <button class="btn ghost wide" id="b-skip" style="margin-top:16px">Skip ahead</button>
      </div>
    </div>
  </section>

  <!-- ============ reveal ============ -->
  <section id="s-reveal" class="hide">
    <div class="split">
      <div>
        <div class="rail" id="rail-r" style="margin-bottom:14px"></div>
        <p class="center" style="margin:0 0 12px"><span class="reason" id="h-reason"></span></p>
        <p class="center sub hide" id="h-why" style="font-weight:600"></p>
        <div class="figbox" id="h-rfig"></div>
      </div>
      <div class="card">
        <h2 id="t-board-lbl">Leaderboard</h2>
        <ol class="board" id="h-board"></ol>
        <button class="btn wide" id="b-next" style="margin-top:8px">Next question</button>
      </div>
    </div>
  </section>

  <!-- ============ podium ============ -->
  <section id="s-podium" class="hide">
    <div class="card center">
      <h1 id="t-winners">🏆 Winners</h1>
      <div class="podium" id="h-pod"></div>
      <ol class="board" id="h-board2" style="max-width:460px;margin:0 auto 18px"></ol>
      <button class="btn danger" id="b-end">End game &amp; wipe everything</button>
      <p class="sub" style="margin-top:10px;font-size:13px" id="t-endnote">
        Ending clears every name and score and sends the class back to the join screen.
      </p>
    </div>
  </section>

</div>

<canvas id="confetti" style="position:fixed;inset:0;pointer-events:none;display:none"></canvas>

<script>
/* ---------------------------------------------------------------
   Teacher screen. Owns the game: builds the questions, renders the
   diagrams, marks the answers, keeps the scores. Learners' devices are
   told only what to show.
   --------------------------------------------------------------- */
const $ = id => document.getElementById(id);
const SECTIONS = ['s-lobby', 's-q', 's-reveal', 's-podium'];
const show = id => SECTIONS.forEach(s => $(s).classList.toggle('hide', s !== id));

const H = {
  players: {},        // pid -> {name, lang, avatar, score}
  game: null,
  i: -1,
  phase: 'lobby',
  partIdx: 0,         // which of cur().parts is on screen
  answers: [],        // one {pid -> answer} map per part of the current question
  endsAt: 0,
  totalMs: 0,
  dead: false         // a newer host tab took over — this one stands down
};

function partSeconds(kind) {
  if (kind === 'rel') return CONFIG.SECONDS_REL;
  if (kind === 'lines') return CONFIG.SECONDS_LINES;
  return CONFIG.SECONDS_REASON;          // reason and yes/no
}

/* ---------- projector language ----------
   Learners each pick a language when they join; this pill translates the
   TEACHER screen. Question/reveal text already carries en+af (reasons.js) —
   only the host's own labels live here. */
let HL = localStorage.getItem('rr-host-lang') === 'af' ? 'af' : 'en';
const HT = {
  codeLbl:    { en: 'Class code', af: 'Klaskode' },
  noSave:     { en: 'Nothing is saved. Names and scores live only in this tab until you end the game.',
                af: 'Niks word gestoor nie. Name en punte leef net in hierdie blad totdat jy die spel beëindig.' },
  nobody:     { en: 'Nobody has joined yet', af: 'Nog niemand het aangesluit nie' },
  lobby1:     { en: '1 player in the lobby', af: '1 speler het aangesluit' },
  lobbyN:     { en: '{n} players in the lobby', af: '{n} spelers het aangesluit' },
  start1:     { en: 'Start — 1 player', af: 'Begin — 1 speler' },
  startN:     { en: 'Start — {n} players', af: 'Begin — {n} spelers' },
  question:   { en: 'Question {a} of {b}', af: 'Vraag {a} van {b}' },
  answered:   { en: '{a} of {b} answered', af: '{a} van {b} het geantwoord' },
  onScreens:  { en: 'On their screens', af: 'Op hulle skerms' },
  skip:       { en: 'Skip ahead', af: 'Slaan oor' },
  /* her ruling 2026-08-13: "Ranglys" sounds like prison — Leaderboard in both */
  boardLbl:   { en: 'Leaderboard', af: 'Leaderboard' },
  next:       { en: 'Next question', af: 'Volgende vraag' },
  winnersBtn: { en: 'Show the winners', af: 'Wys die wenners' },
  winners:    { en: '🏆 Winners', af: '🏆 Wenners' },
  endBtn:     { en: 'End game & wipe everything', af: 'Beëindig die spel & vee alles uit' },
  endNote:    { en: 'Ending clears every name and score and sends the class back to the join screen.',
                af: 'Beëindig vee elke naam en punt uit en stuur die klas terug na die aansluitskerm.' },
  tookTitle:  { en: 'Another teacher screen took over', af: '’n Ander onderwyserskerm het oorgeneem' },
  tookBody:   { en: 'A newer host tab opened with the same class code, so this one has stepped aside ' +
                    'and is no longer running the game.<br>Close this tab — or refresh it to take the game back.',
                af: '’n Nuwer onderwysersblad het met dieselfde klaskode oopgemaak, so hierdie een het ' +
                    'opsy gestaan en beheer nie meer die spel nie.<br>Maak hierdie blad toe — of herlaai dit om die spel terug te vat.' }
};
function ht(key, vals) {
  let s = HT[key][HL] || HT[key].en;
  if (vals) Object.keys(vals).forEach(k => { s = s.replace('{' + k + '}', vals[k]); });
  return s;
}
function applyLang() {
  localStorage.setItem('rr-host-lang', HL);
  $('lang-en').classList.toggle('on', HL === 'en');
  $('lang-af').classList.toggle('on', HL === 'af');
  $('t-code-lbl').textContent = ht('codeLbl');
  $('t-nosave').textContent = ht('noSave');
  $('h-opts-title').textContent = ht('onScreens');
  $('b-skip').textContent = ht('skip');
  $('t-board-lbl').textContent = ht('boardLbl');
  $('t-winners').textContent = ht('winners');
  $('b-end').textContent = ht('endBtn');
  $('t-endnote').textContent = ht('endNote');
  paintLobby();
  /* repaint whatever screen is up so mid-game flips take effect at once */
  if (H.phase === 'q' && cur()) paintQuestion();
  else if (H.phase === 'reveal' && cur()) paintReveal();
}
let net = null, tick = null, pending = null;

/* ---------- single-host election ----------
   One universal class code means ANY open host.html — a stale projector tab,
   a second laptop, a test rig — shares the channel, and two hosts fighting
   over one lobby shows learners another game's reveal (found live,
   2026-08-13: a leftover test tab re-broadcast its old question over
   Megan's fresh lobby). Rule: every host message carries the tab's birth
   time, the NEWEST host wins, an out-ranked host silences itself and says
   so on screen. Learners ignore anything from an out-ranked host. */
const HOST_ID = 'h' + Math.random().toString(36).slice(2, 10);
const HOST_SINCE = Date.now();
let lastAssert = 0;

function assertAlive() {
  if (Date.now() - lastAssert < 1500) return;
  lastAssert = Date.now();
  net.send('host-hello', { hostId: HOST_ID, since: HOST_SINCE });
}

function goDead() {
  if (H.dead) return;
  H.dead = true;
  stopTimer();
  const o = document.createElement('div');
  o.style.cssText = 'position:fixed;inset:0;z-index:99;background:rgba(19,50,75,.93);' +
    'display:flex;align-items:center;justify-content:center;text-align:center;padding:30px';
  o.innerHTML = '<div style="color:#fff;max-width:520px"><div style="font-size:52px">🙅</div>' +
    '<h2 style="color:#fff">' + ht('tookTitle') + '</h2>' +
    '<p style="opacity:.85;line-height:1.6">' + ht('tookBody') + '</p></div>';
  document.body.appendChild(o);
}

$('h-code').textContent = CONFIG.CLASS_CODE;
$('h-url').textContent = location.href.replace(/host\.html.*$/, '');

const cur = () => H.game && H.game[H.i];
const playerIds = () => Object.keys(H.players);
const answeredNow = () => Object.keys(H.answers[H.partIdx] || {}).length;

/* ---------- connection ---------- */
net = makeNet((event, p) => {
  /* another host on the channel: newer birth time wins, loser goes quiet */
  if (p && p.hostId && p.hostId !== HOST_ID) {
    if ((p.since || 0) > HOST_SINCE) goDead();
    else assertAlive();                    // I'm newer — tell the old tab to stand down
    return;
  }
  if (H.dead) return;
  if (event === 'join') return onJoin(p);
  if (event === 'answer') return onAnswer(p);
}, status => {
  if (status === 'SUBSCRIBED' && !H.dead) {
    assertAlive();                         // silences any zombie host out there
    net.send('ping', {});                  // ask anyone already waiting to check in
  }
});

/* Heartbeat: re-send the current state every 2.5s. Broadcasts are
   fire-and-forget — a tablet that sleeps through one wakes up stranded on
   the old screen forever (seen live: "stuck on You're in" / stuck after not
   answering). With the heartbeat every device converges within a couple of
   seconds of rejoining the network, whatever it missed. */
setInterval(() => { if (!H.dead) broadcast(); }, 2500);

function onJoin(p) {
  if (!p || !p.pid || !p.name) return;
  if (!H.players[p.pid]) H.players[p.pid] = { name: p.name, lang: p.lang || 'en', avatar: avValid(p.avatar), score: 0 };
  else {
    H.players[p.pid].name = p.name;
    H.players[p.pid].lang = p.lang || 'en';
    H.players[p.pid].avatar = avValid(p.avatar);
  }
  paintLobby();
  broadcastSoon();
}

/* ---------- broadcasting ---------- */
function broadcastSoon() {
  if (pending) return;
  pending = setTimeout(() => { pending = null; broadcast(); }, 250);
}

function broadcast() {
  if (H.dead) return;
  /* every state carries the host's identity + birth time, so players can
     ignore anything from an out-ranked host tab */
  const st = { phase: H.phase, hostId: HOST_ID, since: HOST_SINCE, pids: playerIds() };
  if (H.phase === 'q') {
    const q = cur(), part = q.parts[H.partIdx];
    st.n = q.n; st.total = q.total;
    st.part = H.partIdx + 1;
    st.partKind = part.kind;
    st.svg = q.svgQ;
    st.seconds = Math.round(H.totalMs / 1000);
    st.msLeft = Math.max(0, H.endsAt - Date.now());
    if (part.options) st.options = part.options;
  } else if (H.phase === 'reveal') {
    const q = cur();
    st.n = q.n; st.total = q.total;
    st.svgR = q.svgR;
    st.reveal = q.reveal;
    st.why = q.why || null;
    st.letter = RULE_LETTER[q.answer] || 'Δ';   // which rail tile lights up
    st.partKinds = q.parts.map(p => p.kind);    // so a player can name WHICH follow-up missed
    st.verdicts = verdicts();
    st.board = board().slice(0, 5);
  } else if (H.phase === 'podium') {
    st.top3 = board().slice(0, 3);
    st.places = places();
  }
  net.send('state', st);
}

/* ---------- lobby ---------- */
function paintLobby() {
  const ids = playerIds();
  $('h-count').textContent = ids.length === 0 ? ht('nobody')
    : ids.length === 1 ? ht('lobby1') : ht('lobbyN', { n: ids.length });
  $('b-start').disabled = ids.length === 0;
  $('b-start').textContent = ids.length === 1 ? ht('start1') : ht('startN', { n: ids.length });
  /* the Kahoot wall: each learner pops in as a tilted pastel card with
     their avatar — colour and tilt are seeded from the pid, so a card
     never changes personality on repaint */
  const byPid = {};
  [...$('h-roster').children].forEach(c => { byPid[c.dataset.pid] = c; });
  ids.forEach(pid => {
    const pl = H.players[pid];
    if (byPid[pid]) {                        // rejoined, maybe with a new name/avatar
      byPid[pid].querySelector('.pname').textContent = pl.name;
      byPid[pid].querySelector('.pav').textContent = avEmoji(pl.avatar);
      return;
    }
    const c = document.createElement('div');
    c.className = 'pcard'; c.dataset.pid = pid;
    c.style.background = avPastel(pid);
    c.style.setProperty('--tilt', avTilt(pid));
    c.innerHTML = '<span class="pav"></span><span class="pname"></span>';
    c.querySelector('.pav').textContent = avEmoji(pl.avatar);
    c.querySelector('.pname').textContent = pl.name;
    $('h-roster').appendChild(c);
  });
}

/* ---------- game flow ---------- */
$('b-start').onclick = () => {
  H.game = buildGame((Date.now() ^ (Math.random() * 1e9)) >>> 0);
  H.i = -1;
  nextQuestion();
};

function nextQuestion() {
  H.i++;
  if (H.i >= H.game.length) return podium();
  const q = H.game[H.i];
  H.phase = 'q'; H.partIdx = 0;
  H.answers = q.parts.map(() => ({}));
  startTimer(partSeconds(q.parts[0].kind));
  paintQuestion();
  broadcast();
}

function advance() {
  /* re-entry guard: Skip stays visible across part switches, so a
     double-click would advance twice and swallow a whole part */
  if (Date.now() - (H.lastAdvance || 0) < 500) return;
  H.lastAdvance = Date.now();
  stopTimer();
  const q = cur();
  if (H.phase === 'q' && H.partIdx < q.parts.length - 1) {
    H.partIdx++;
    startTimer(partSeconds(q.parts[H.partIdx].kind));
    paintQuestion();
    broadcast();
    return;
  }
  reveal();
}

function reveal() {
  H.phase = 'reveal';
  paintReveal();
  broadcast();
  show('s-reveal');
}

$('b-skip').onclick = advance;
$('b-next').onclick = nextQuestion;

function podium() {
  stopTimer();
  H.phase = 'podium';
  const top = board().slice(0, 3);
  $('h-pod').innerHTML = '';
  [1, 0, 2].forEach(i => {
    const p = top[i]; if (!p) return;
    const d = document.createElement('div');
    d.className = 'pod p' + (i + 1);
    d.innerHTML = '<div class="pav-big"></div><div class="name"></div><div class="block">' + (i + 1) +
                  '</div><div class="score">' + p.score + '</div>';
    d.querySelector('.pav-big').textContent = avEmoji(p.avatar);
    d.querySelector('.name').textContent = p.name;
    $('h-pod').appendChild(d);
  });
  paintBoard($('h-board2'), board().slice(0, 8));
  broadcast();
  show('s-podium');
  confetti();
}

$('b-end').onclick = () => {
  H.phase = 'ended';
  net.send('state', { phase: 'ended', hostId: HOST_ID, since: HOST_SINCE });
  setTimeout(() => {
    net.leave();
    H.players = {}; H.game = null; H.i = -1; H.answers = { 1: {}, 2: {} };
    location.reload();
  }, 600);
};

/* ---------- marking ---------- */
function onAnswer(p) {
  const q = cur();
  if (!q || !p || !H.players[p.pid]) return;
  if (p.n !== q.n || H.phase !== 'q') return;
  const pi = (p.part | 0) - 1;
  if (pi < 0 || pi >= q.parts.length) return;
  /* answers for any EARLIER part of the same question stay welcome: a kid on
     laggy wifi who tapped in time must not lose credit because the message
     landed after the screen moved on. Verdicts only run at the reveal. */
  if (pi > H.partIdx) return;
  if (H.answers[pi][p.pid]) return;

  const part = q.parts[pi];
  const isMain = part.kind === 'reason' || part.kind === 'yesno';
  /* a part may have more than one true answer — see accept in questions.js */
  const ok = (part.accept || [part.answer]).indexOf(p.choice) >= 0;
  const trap = (part.kind === 'reason' && !ok && TRAPS[p.choice]) ? p.choice : null;
  let pts = 0;
  if (ok) {
    const frac = Math.max(0, 1 - p.ms / (partSeconds(part.kind) * 1000));
    pts = isMain
      ? Math.round(CONFIG.POINTS_BASE + CONFIG.POINTS_SPEED * frac)
      : Math.round(CONFIG.POINTS_FOLLOWUP_BASE + CONFIG.POINTS_FOLLOWUP_SPEED * frac);
  }
  H.answers[pi][p.pid] = { choice: p.choice, ok, pts, trap };
  H.players[p.pid].score += pts;
  paintTally();
  if (answeredNow() >= playerIds().length) advance();
}

function verdicts() {
  const q = cur(), out = {};
  playerIds().forEach(pid => {
    const per = q.parts.map((_, i) => H.answers[i][pid]);
    if (per.every(a => !a)) return;               // never answered — no card
    const a0 = per[0];
    out[pid] = {
      ok: !!(a0 && a0.ok),
      pts: per.reduce((s, a) => s + (a ? a.pts : 0), 0),
      trap: a0 ? a0.trap : null,
      total: H.players[pid].score,
      /* correctness of each follow-up part, aligned with st.partKinds[1..] */
      followups: q.parts.length > 1 ? per.slice(1).map(a => !!(a && a.ok)) : null
    };
  });
  return out;
}

function board() {
  return playerIds()
    .map(pid => ({ pid, name: H.players[pid].name, avatar: H.players[pid].avatar, score: H.players[pid].score }))
    .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
}

/* place goes over the wire as a plain number — the learner's device knows
   whether to write "3rd" or "3de" */
function places() {
  const out = {};
  board().forEach((p, i) => { out[p.pid] = { place: i + 1, score: p.score }; });
  return out;
}

/* ---------- painting ---------- */
function paintQuestion() {
  const q = cur(), part = q.parts[H.partIdx];
  railMount($('rail-q'));
  railReset($('rail-q'));
  $('h-qn').textContent = ht('question', { a: q.n, b: q.total });
  $('h-fig').innerHTML = q.svgQ;
  const PROMPTS = { reason: UI.forWhy, yesno: UI.isExt, rel: UI.whichRel, lines: UI.whichPar };
  $('h-prompt').textContent = PROMPTS[part.kind][HL] || PROMPTS[part.kind].en;
  $('h-prompt').className = 'prompt' + (part.kind === 'reason' ? '' : ' small');
  const list = part.kind === 'lines' ? part.options
    : part.kind === 'rel' ? RELS.map(id => REL_TEXT[id][HL] || REL_TEXT[id].en)
    : part.kind === 'yesno' ? [YESNO.yes[HL] || YESNO.yes.en, YESNO.no[HL] || YESNO.no.en]
    : OPTION_ORDER.map(id => optionText(id, HL));
  $('h-opts').innerHTML = '';
  list.forEach(txt => {
    const c = document.createElement('span');
    c.className = 'chip'; c.textContent = txt;
    $('h-opts').appendChild(c);
  });
  paintTally();
  show('s-q');
}

function paintTally() {
  $('h-tally').textContent = ht('answered', { a: answeredNow(), b: playerIds().length });
}

function paintReveal() {
  const q = cur();
  railMount($('rail-r'));
  railGlow($('rail-r'), RULE_LETTER[q.answer] || 'Δ');
  $('h-reason').textContent = q.reveal[HL] || q.reveal.en;
  const why = q.why ? (q.why[HL] || q.why.en) : '';
  $('h-why').textContent = why;
  $('h-why').classList.toggle('hide', !why);
  $('h-rfig').innerHTML = q.svgR;
  paintBoard($('h-board'), board().slice(0, 5));
  $('b-next').textContent = H.i >= H.game.length - 1 ? ht('winnersBtn') : ht('next');
}

function paintBoard(el, rows) {
  el.innerHTML = '';
  rows.forEach((p, i) => {
    const li = document.createElement('li');
    li.innerHTML = '<span class="pos">' + (i + 1) + '</span><span class="bav"></span>' +
                   '<span class="nm"></span><span class="pts">' + p.score + '</span>';
    li.querySelector('.bav').textContent = avEmoji(p.avatar);
    li.querySelector('.nm').textContent = p.name;
    el.appendChild(li);
  });
}

/* ---------- clock ---------- */
function startTimer(seconds) {
  stopTimer();
  H.totalMs = seconds * 1000;
  H.endsAt = Date.now() + H.totalMs;
  const paint = () => {
    const left = Math.max(0, H.endsAt - Date.now());
    const s = Math.ceil(left / 1000);
    $('h-clock').textContent = s;
    $('h-clock').className = 'timer' + (s <= 5 ? ' low' : '');
    railDrain($('rail-q'), 1 - left / H.totalMs);
    if (left <= 0) { stopTimer(); advance(); }
  };
  paint();
  tick = setInterval(paint, 200);
}
function stopTimer() { if (tick) { clearInterval(tick); tick = null; } }

/* ---------- confetti (podium only) ---------- */
function confetti() {
  const cv = $('confetti'), ctx = cv.getContext('2d');
  cv.style.display = 'block';
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#7c3aed', '#db2777', '#0d9488', '#f59e0b', '#2563eb'];
  const bits = Array.from({ length: 130 }, (_, i) => ({
    x: Math.random() * cv.width, y: -Math.random() * cv.height,
    r: 4 + Math.random() * 6, s: 1.4 + Math.random() * 2.6,
    c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6,
    /* every fourth bit is a falling FUNKY X letter */
    L: i % 4 === 0 ? RAIL[i / 4 % RAIL.length | 0].L : null
  }));
  ctx.textAlign = 'center';
  let frames = 0;
  (function loop() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    bits.forEach(b => {
      b.y += b.s; b.a += .06; b.x += Math.sin(b.a) * .9;
      if (b.y > cv.height) { b.y = -10; b.x = Math.random() * cv.width; }
      ctx.fillStyle = b.c;
      if (b.L) {
        ctx.font = '700 ' + (b.r + 14) + 'px Fredoka, sans-serif';
        ctx.fillText(b.L, b.x, b.y);
      }
      else ctx.fillRect(b.x, b.y, b.r, b.r * 1.6);
    });
    if (++frames < 600) requestAnimationFrame(loop);
    else cv.style.display = 'none';
  })();
}

$('lang-en').onclick = () => { HL = 'en'; applyLang(); };
$('lang-af').onclick = () => { HL = 'af'; applyLang(); };

railMount($('rail-hero'), { stagger: true });
applyLang();                 // paints the lobby too
show('s-lobby');
</script>
